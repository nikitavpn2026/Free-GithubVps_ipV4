name: VPS Session
on:
  workflow_dispatch:

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt update
          sudo apt install -y curl unzip sudo net-tools
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: vps-github
          ssh: true
      - name: Show Tailscale IP
        run: |
          sleep 5
          echo "Ваш Tailscale IP-адрес:"
          tailscale ip -4
      - name: Keep session alive for 6 hours
        run: sleep 21600
